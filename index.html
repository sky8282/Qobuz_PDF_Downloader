<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qobuz•PDF Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #1f2937;
            border-top: 4px solid #eab308;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .detecting-pulse {
            animation: pulse-bg 2s infinite;
        }
        @keyframes pulse-bg { 0%, 100% { border-color: rgba(255,255,255,0.05); } 50% { border-color: rgba(59, 130, 246, 0.5); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        
        .header-sticky {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    
    <div class="header-sticky">
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center gap-4">
            
            <div class="relative flex items-end justify-center">
                <h1 onclick="resetHome()" class="text-5xl font-extrabold tracking-tight cursor-pointer select-none hover:scale-105 transition">
                    <span class="text-white">Qobuz</span><span class="text-yellow-500">PDF</span>
                </h1>
                
                <a href="https://github.com/sky8282" target="_blank" class="absolute -right-6 bottom-1.5 text-gray-400 hover:text-white hover:scale-125 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57C20.565 21.795 24 17.31 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                </a>
            </div>

            <div class="w-full flex gap-2">
                <input type="text" id="searchInput" 
                    class="flex-1 bg-gray-800/80 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 text-white placeholder-gray-500 transition-all shadow-inner"
                    placeholder="输入:( 歌手 或 专辑 或 歌手 - 专辑名 ) 进行搜索与下载专辑封面与 PDF 文件" 
                    onkeydown="if(event.key === 'Enter') startSearch()">
                
                <button onclick="startSearch()" 
                    class="bg-blue-600 hover:bg-yellow-500 hover:text-black text-white px-6 py-2 rounded-lg font-medium shadow-lg transition duration-200">
                    搜索
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-[92%] mx-auto p-4 md:p-6 pb-24 mt-2">
        <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4"></div>
        
        <div id="loading" class="hidden flex flex-col items-center py-8">
            <div class="loader"></div>
        </div>
        
        <div id="scrollSentinel" class="h-20 w-full"></div>
        <div id="noMore" class="hidden text-center text-gray-500 py-8 text-sm">已加载全部结果</div>
    </div>

    <button id="backToTop" onclick="scrollToTop()" 
        class="fixed bottom-8 right-8 bg-yellow-500 text-black p-3 rounded-full shadow-lg hover:bg-yellow-400 hover:scale-110 transition-all transform z-50 hidden items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
    </button>

    <script>
        let currentQuery = "";
        let offset = 0;
        let isLoading = false;
        let hasMore = true;
        const limit = 30; 

        function resetHome() { window.location.reload(); }
        
        const backToTopBtn = document.getElementById('backToTop');
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backToTopBtn.classList.remove('hidden');
                backToTopBtn.classList.add('flex');
            } else {
                backToTopBtn.classList.add('hidden');
                backToTopBtn.classList.remove('flex');
            }
        };
        
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function startSearch() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return;
            currentQuery = input;
            offset = 0;
            hasMore = true;
            document.getElementById('resultsGrid').innerHTML = '';
            document.getElementById('noMore').classList.add('hidden');
            await fetchResults();
        }

        async function fetchResults() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&offset=${offset}`);
                const data = await response.json();
                if (data.albums && data.albums.length > 0) {
                    renderAlbums(data.albums);
                    detectBatchDetails(data.albums);
                    offset += data.albums.length;
                    if (data.albums.length < limit) {
                        hasMore = false;
                        document.getElementById('noMore').classList.remove('hidden');
                    }
                } else {
                    hasMore = false;
                    if (offset === 0) {
                        document.getElementById('resultsGrid').innerHTML = '<div class="col-span-full text-center text-gray-400 mt-10">未找到相关专辑</div>';
                    } else {
                        document.getElementById('noMore').classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error("Error:", error);
            } finally {
                isLoading = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderAlbums(albums) {
            const grid = document.getElementById('resultsGrid');
            albums.forEach(album => {
                const card = document.createElement('div');
                card.id = `card-${album.id}`;
                card.className = "relative group bg-gray-800 rounded-xl overflow-hidden shadow-lg transition-all hover:scale-[1.02] ring-1 ring-white/5 detecting-pulse";
                let initialBadge = '';
                if (album.hires) {
                    initialBadge = `<div class="absolute top-0 left-0 bg-yellow-400 text-black text-xs font-extrabold px-2 py-1 z-20 rounded-tl-xl rounded-br-lg shadow-md">Hi-Res</div>`;
                }
                card.innerHTML = `
                    <div class="relative aspect-square">
                        <img src="${album.cover_proxy_url}" alt="${album.title}" class="w-full h-full object-cover" loading="lazy">
                        
                        <div id="badge-${album.id}">${initialBadge}</div>
                        
                        <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center gap-1.5 p-2 md:p-3">
                            
                            <a href="/download/cover/${album.id}" target="_blank" 
                               class="w-auto px-3 md:px-4 bg-blue-600 hover:bg-yellow-500 text-white hover:text-black py-1 md:py-1.5 rounded-full font-bold text-center transition text-[10px] md:text-[11px] backdrop-blur-sm shadow-xl border border-white/10 whitespace-nowrap">
                               点击下载专辑封面
                            </a>
                            
                            <div id="btns-${album.id}" class="flex flex-col items-center gap-1.5 w-full"></div>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-gray-100 truncate text-sm leading-tight" title="${album.title}">${album.title}</h3>
                        <p class="text-gray-400 text-xs truncate mt-1 hover:text-gray-300">${album.artist}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function detectBatchDetails(albums) {
            const ids = albums.map(a => a.id);
            try {
                const response = await fetch('/api/check_batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: ids })
                });
                const results = await response.json();

                for (const [id, info] of Object.entries(results)) {
                    const card = document.getElementById(`card-${id}`);
                    if (!card) continue;
                    card.classList.remove('detecting-pulse');
                    
                    const badgeContainer = document.getElementById(`badge-${id}`);
                    const isHires = info.hires;
                    const hasPdf = info.has_pdf;
                    
                    if (isHires || hasPdf) {
                        let badgeText = [];
                        if (isHires) badgeText.push('Hi-Res');
                        if (hasPdf) badgeText.push('PDF');

                        badgeContainer.innerHTML = `
                            <div class="absolute top-0 left-0 bg-yellow-400 text-black text-xs font-extrabold px-2 py-1 z-20 rounded-tl-xl rounded-br-lg shadow-md animate-fade-in">
                                ${badgeText.join(' / ')}
                            </div>
                        `;
                    } else {
                        badgeContainer.innerHTML = '';
                    }

                    const btnContainer = document.getElementById(`btns-${id}`);
                    let dynamicButtonsHtml = '';

                    if (info.has_artist_img) {
                        dynamicButtonsHtml += `
                            <a href="/download/artist/${id}" target="_blank" 
                               class="w-auto px-3 md:px-4 bg-green-600 hover:bg-yellow-500 text-white hover:text-black py-1 md:py-1.5 rounded-full font-bold text-center transition text-[10px] md:text-[11px] backdrop-blur-sm shadow-xl border border-white/10 whitespace-nowrap animate-fade-in">
                               点击下载歌手头像
                            </a>
                        `;
                    }

                    if (hasPdf) {
                        dynamicButtonsHtml += `
                            <a href="/download/pdf/${id}" target="_blank" 
                               class="w-auto px-3 md:px-4 bg-red-600 hover:bg-yellow-500 text-white hover:text-black py-1 md:py-1.5 rounded-full font-bold text-center transition text-[10px] md:text-[11px] backdrop-blur-sm shadow-xl border border-white/10 whitespace-nowrap animate-fade-in">
                               点击下载 PDF 文件
                            </a>
                        `;
                    }
                    
                    btnContainer.innerHTML = dynamicButtonsHtml;
                }
            } catch (e) {
                console.error(e);
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && hasMore && currentQuery) {
                fetchResults();
            }
        }, { rootMargin: '200px' });

        observer.observe(document.getElementById('scrollSentinel'));
    </script>
</body>
</html>
